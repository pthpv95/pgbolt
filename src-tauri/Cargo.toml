[package]
name = "pgbolt"
version = "0.1.0"
description = "A fast Postgres GUI"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pgbolt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "uuid",
  "json",
  "bigdecimal",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
